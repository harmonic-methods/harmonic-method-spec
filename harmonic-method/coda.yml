# The system Coda — the outcome this repository exists to serve.
# Conformant to specs/coda.yml. Root Coda: omits parent.
coda:
  id: HM-CODA
  statement: >
    A team can adopt the Harmonic Method from this repository alone — read the
    entity model and find it sufficient for the work they actually do, name who
    answers for each of its five functions, compose and correct the entities
    themselves with an agent, assess them against the published instruments, and
    find that a score means here what it would mean in any conforming
    implementation — without an account, a vendor relationship, or a call.
