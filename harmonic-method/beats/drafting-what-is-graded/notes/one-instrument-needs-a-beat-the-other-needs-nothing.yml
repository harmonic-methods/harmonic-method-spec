# Note — conformant to specs/note.yml
note:
  id: HM-N-140
  type: decision
  attached_to: HM-B-009
  beat_version: HM-BV-009.3
  content: >
    `beat-version-composing` requires an existing, scored Beat before it will
    draft a step, and says so as its first move. `beat-composing` requires
    nothing. This is the one place the two instruments genuinely diverge rather
    than merely differing in which entity they produce.
  rationale: >
    The asymmetry is in the specs, not invented for the instruments. A Coda
    can be written from a paragraph and nothing else — `specs/coda.yml` asks
    for a statement and an optional parent, both suppliable from a description
    alone. A Beat Version cannot exist without a Beat to belong to, and
    `specs/beat.yml`'s reference gate scores the Beat itself before it may be
    decomposed. Drafting a step onto a capability nobody has settled is
    drafting into a foundation that has not been laid; the step would inherit
    every unresolved question the Beat itself still carries, and no amount of
    care in the step's own summary and scope fixes that.

    The alternative — letting the instrument draft a plausible Beat alongside
    the step, the way a person might sketch both at once — was not taken,
    because it would have let one producing instrument silently absorb
    another's job. `specs/beat.yml`'s gate and `beat-composing`'s existence
    both already answer the question of how a Beat gets drafted; duplicating
    that here would be two answers to it, and one of them would drift.

    Stated as a decision rather than left implicit, because it is exactly the
    kind of asymmetry a reader comparing the two instruments would otherwise
    have to notice on their own and might reasonably assume was an oversight.
