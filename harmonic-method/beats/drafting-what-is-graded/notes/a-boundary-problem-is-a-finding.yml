# Note — conformant to specs/note.yml
note:
  id: HM-N-102
  type: decision
  attached_to: HM-B-009
  beat_version: HM-BV-009.2
  content: >
    When revising finds that a Beat holds two capabilities, or that one belongs
    with a neighbour, the instrument reports a finding naming what it sees. It
    does not split, merge, or propose an operation for doing either.
  rationale: >
    The method names no entity for splitting or merging a capability. An
    instrument needing somewhere to put that output has two honest choices —
    report it as a finding, or ask the capability that owns the entity model
    whether an entity is owed — and one dishonest one, which is to invent a
    local operation so the instrument feels complete. The dishonest option is
    the tempting one because it makes a tool look finished, and it would put a
    shape into circulation that no specification here defines and no other
    implementation could read.

    The reference implementation does record merges and splits, which is worth
    noting rather than hiding: that is an extension, it conforms, and it is
    evidence that the operation is real. It is not evidence about what the method
    should name, and [HM-N-093] already set the test for that — a second
    implementation to design against, or one plus a case its shape cannot carry.
    One implementation and an instrument's convenience is not that.

    There is a second reason beyond conformance, and it may be the better one. A
    boundary problem is the case where a person has to decide something, and an
    instrument that offered to perform the split would be inviting an agent to
    redraw a system's architecture on the strength of a low score. That is the
    Composer's judgement — what the system is for, what belongs inside it, where
    its boundaries fall — and the accountability does not move because a tool
    could act. A finding puts the decision in front of the person who answers
    for it, which is the correct output even if the method later names the
    entity.
