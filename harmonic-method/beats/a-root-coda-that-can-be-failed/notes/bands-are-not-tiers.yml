# Note — conformant to specs/note.yml
note:
  id: HM-N-126
  type: decision
  attached_to: HM-B-012
  beat_version: HM-BV-012.2
  content: >
    Two bands are added that the ceiling could not have carried: `comparable`,
    for costly voluntary acts by third parties toward a comparable thing, and
    `asserted, under test`, for an assumption registered with what would falsify
    it, who is accountable, and by when. The comparable band never reaches
    Reciprocal. A test that elapses with no reading recorded forfeits its band.
  rationale: >
    Both were argued for while the ceiling still existed, and both were stuck on
    the same unanswerable question: what number does this tier cap at. Three
    underweights it, four equates evidence about somebody else with evidence
    about you, and there is no principled way to choose. Once bands stop
    converting to score points the question dissolves — an ordered band needs an
    order, not a value.

    Treating an unvalidated assumption as indistinguishable from a bare assertion
    was the more serious of the two omissions. A rubric that only rewards what
    has been proven rewards organizations that claim only what they have already
    done, which is precisely backwards for anything worth attempting, and a root
    Coda that assumed perfect information before committing would be useless. The
    distinction that matters is not validated against unvalidated; it is managed
    against unmanaged. All four parts are required because three of them describe
    an intention.

    The forfeit rule is where the discipline lives. A commitment claimed and not
    kept scores below an honest assertion, because it bought a band with
    discipline it did not spend. That also keeps the register self-cleaning:
    stale assumptions actively cost something, so nobody accumulates them. It is
    the same shape as drift against an anchor — written down, then read on an
    occasion.

    Comparable evidence is excluded from Reciprocal because that dimension asks
    whether this exchange with this counterparty has turned extractive, and no
    fact about a comparable arrangement can answer it. The failure mode it guards
    is invisible from outside the relationship. Requiring the disanalogy is what
    makes a named comparable falsifiable at all; picking a flattering reference
    class is the easiest move in the scheme.
