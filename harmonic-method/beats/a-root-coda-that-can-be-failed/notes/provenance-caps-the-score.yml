# Note — conformant to specs/note.yml
note:
  id: HM-N-116
  type: decision
  attached_to: HM-B-012
  beat_version: HM-BV-012.1
  content: >
    A score on the two dimensions that concern evidence is capped by where that
    evidence came from: asserted by the organization ceilings at 2, read out of
    the record at 4, and generated by the counterparty at some cost to them at 5.
    A qualitative measure reaches the top tier if it names its observer. The
    instrument is forbidden from simulating the counterparty and scoring from
    what it imagined. Both rules sit inside the guarded sections.
  rationale: >
    The instrument has to run where the other party is not in the room, which is
    every time it runs. Two designs were available and only one of them is
    honest. The instrument could estimate the counterparty's benefit — an agent
    does this fluently, at length, with reasoning attached — and the output would
    be an assertion by the organization wearing the other party's name, which is
    precisely the defect the dimension exists to catch. Automating that defect
    makes it worse rather than better, because a number with an argument behind
    it is harder to dismiss than the same claim stated plainly.

    Capping instead of refusing keeps the instrument usable everywhere while
    making the gap between a well-articulated claim and a verified one a visible
    number rather than a hidden assumption. Everything an agent is good at still
    happens: reading, classifying, extracting a signal already sitting in the
    record, and constructing the strongest case that an arrangement has stopped
    serving the other side. What it cannot do is award the top of the scale to
    evidence it produced itself.

    The pattern is already this repository's. The instrument that takes an anchor
    reports what it examined separately from what it took on the record's word,
    and the Beat rubric scores a dimension from partial context while saying the
    context was missing. A ceiling is that discipline with a number attached.

    The qualitative clause is not a softening. Without it the ceiling
    systematically demotes what counts worst and matters most — trust, standing,
    the counterparty's own position — and an instrument that pushed a Producer
    toward whatever is cheapest to count would be causing the failure it was
    built to prevent.

    Both rules are inside the digest deliberately. They change what a score
    means, so loosening either is an edit to the published standard and should
    fail the conformance check rather than pass as a wording change. Each was
    made to fail before being believed: the scoring scale and the provenance
    table were perturbed in turn and the run failed on both.
