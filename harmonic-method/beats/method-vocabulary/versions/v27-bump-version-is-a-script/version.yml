# Beat Version — conformant to specs/beat.yml
beat_version:
  id: HM-BV-003.27
  beat: HM-B-003
  title: The spec set version moves by running a command, not by hand
  status: active
  summary: >
    AGENTS.md already states the rule: change the spec set version in the
    manifest and every spec together, and when editing text with a script,
    assert that every replacement matched. What existed to follow that rule was
    a hand-run sed pattern, redone from memory each time the version moved. It
    moved five times in this development cycle — 1.3.0 through 1.7.0 — each time
    as the same manual dance, which is exactly the shape of repetition this
    method's own instruments exist to catch when it shows up in someone else's
    work.

    `tools/bump-version.mjs` does the dance instead. It reads the current version
    from `specs/spec-set.yml`, replaces it in every file under `specs/` and
    `examples/` that carries it as a parsed field, and refuses to finish quietly:
    a run that touches zero files exits non-zero rather than reporting success,
    the same discipline `checkPublishedCounts` already applies to a stated
    number nothing enforces.

    Done when: the script exists, is exercised against a real version move and a
    reversion back, refuses a same-version call, a malformed version, and a
    missing argument, and is registered as `npm run bump-version`.
  scope: >
    In: `tools/bump-version.mjs`; the `bump-version` npm script; exercising it
    against a real bump and revert to confirm all twelve files move together and
    `npm run validate` stays conformant on both ends; and the three refusal
    paths.
    In also: closing the step whose work has reached the trunk, which
    [HM-N-055] puts in the next substantive step's scope.

    Out: any version move itself. This step leaves the spec set exactly where it
    found it — 1.7.0 — because a tooling addition is not a reason to move the
    number it operates on, and doing so here would make this step's own diff
    harder to read than the tool it adds.

    Out: bumping `package.json`, or the rubric fingerprint. Those are separate
    concerns with separate triggers — the checker's own version and a guarded
    rubric's digest — and the script says so rather than reaching for either.

    Out: any change to the versioning rule itself. `AGENTS.md` already states
    what must move together and why; this makes doing what it says less costly,
    it does not change what it says.

    Risks stated: the script trusts the manifest's current value to appear
    verbatim in every target file. If a file were hand-edited into disagreement
    before a bump ran, the script would silently skip it — the same failure
    `npm run validate` already exists to catch, so a bump is still followed by a
    validate run rather than trusted on its own.
