# Beat Version — conformant to specs/beat-version.yml
beat_version:
  id: HM-BV-003.1
  beat: HM-B-003
  title: The entity specs at 1.0.0
  status: delivered
  summary: >
    Coda, Beat, Beat Version, Revision, and Note are each published as
    a machine-readable spec carrying fields, required-ness, lifecycle enums, and
    governing rules, with a worked example to pattern-match against. An agent
    can name entities and attach knowledge correctly from these files alone.
  scope: >
    In: the entity specs, their field and rule definitions, the medium-
    agnostic framing, and one conformant worked example.
    Out: storage, query, or lifecycle-transition behavior; anything specific to
    the reference implementation's data model; and rubric content, which belongs
    to the quality Beats.
