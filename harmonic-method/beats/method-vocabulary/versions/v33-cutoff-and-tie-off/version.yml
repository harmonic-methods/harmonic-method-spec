# Beat Version — conformant to specs/beat.yml
beat_version:
  id: HM-BV-003.33
  beat: HM-B-003
  title: A Bar ends at an instant, and its unfinished work is tied off
  status: active
  summary: >
    `specs/bar.yml` gave a Bar a boundary at each end and never said which side
    of the boundary owned it. `starts` and `ends` were dates, nothing stated
    whether `ends` was the last day inside the Bar or the first day outside it,
    and the two readings disagree on exactly one day per boundary — the day a
    team most needs to agree on. The checker already treated the window as
    half-open, accepting a Bar that starts on its predecessor's `ends`, so the
    published rule and the enforced one had quietly parted.

    This step names the end boundary the Cutoff and makes it an instant: a
    Bar's window includes its start and excludes its Cutoff, so adjacent Bars
    share one instant and no day belongs to both. It also names the ceremony the
    method had been assuming without a word for it — the Tie off, held by the
    Conductor at or after the Cutoff, which settles the Bar's unfinished work
    before the Bar is closed. The order at a boundary becomes Cutoff, Tie off,
    Downbeat. The Downbeat itself is unchanged.
  scope: >
    In: `specs/bar.yml` — `starts` and `ends` move from `date` to `timestamp`,
    with a date-only value read as the start of that day in the cadence owner's
    time zone so no stored value becomes invalid; `ends` is described as the
    Cutoff; `status` says a Bar past its Cutoff stays open until its Tie off
    finishes; three rules for the half-open window, the Tie off, and the order
    at a boundary. The worked example's two Bars restated as half-open windows.
    The cadence paragraph in `README.md` and the Bar line in `llms.txt`. A
    decision Note, a changelog entry, and the spec set minor step.

    Out: a field or an entity for the Tie off. It is a ceremony; its outcome is
    the Bar's move to closed, which `status` already carries. Out: a name or an
    enum for what happens to an unfinished item — carried forward, dropped,
    finished late. No spec here records items against a Bar, so there is nowhere
    for such an outcome to live, and inventing one would publish a field nobody
    asked for. Out: which Bar a boundary Downbeat names in its `bar` field; the
    order is stated, the reference is left as `specs/downbeat.yml` has it.

    Out: a checker change. The sibling-overlap check already compares a start
    against the previous Cutoff with a strict inequality, which is the half-open
    reading; it was made to fail by moving a sibling's start one day before its
    predecessor's Cutoff before being relied on.

    Risks stated: a tree that wrote `ends` as an inclusive last day now reads one
    day short, and nothing can detect that, because both readings parse. The
    worked example was in exactly that state. The cost falls on adopters with
    recorded cadences; the changelog says so plainly rather than leaving them to
    find it.
