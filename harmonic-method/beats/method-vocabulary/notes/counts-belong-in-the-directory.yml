# Note — conformant to specs/note.yml
note:
  id: HM-N-024
  type: guidance
  attached_to: HM-B-003
  beat_version: HM-BV-003.4
  content: >
    Do not write a count of files or entities into prose. The kit claimed "six
    entity specs" in five places — a Beat Version title, two Beat Version scope
    statements, one Beat Version summary, and a changelog entry — while `specs/`
    held five, from the first release onward. No spec was ever deleted; the
    number was simply wrong when first written and was then copied forward by
    every artifact that referred back to it. All five have been corrected in
    place, as factual errors rather than superseded decisions, per [HM-N-023].
    The rule the kit already applies to entity files applies to prose too: the
    directory is the list. Say "the entity specs", not how many, and a reader
    who wants the count can run `ls`.
