# Beat — conformant to specs/beat.yml
beat:
  id: K-B-003
  title: Machine-readable method vocabulary
  status: open
  coda:
    statement: >
      An agent handed this repository can work in the Harmonic Method correctly —
      naming the right entity, attaching knowledge to the right place, and
      respecting the lifecycle rules — without a human translating the method
      into prose first.
    parent: K-CODA
  description: >
    The capability by which the method's entity model is published in a form
    tools and agents can consume directly: Coda, Beat, Beat Version, Revision,
    and Note, each with its fields, required-ness, lifecycle enum, and
    the rules that govern it. The vocabulary is medium-agnostic by design — a
    Revision may be a pull request, a procedure document, or a runbook diff.
  # notes: see ./notes/ — the directory is the list.
  # versions: see ./versions/ — the directory is the list.
