# Note — conformant to specs/note.yml
note:
  id: K-N-011
  type: decision
  attached_to: K-B-001
  content: >
    The kit stays a single flat repository for now rather than becoming a
    monorepo with a package per agent platform. Eventual targets, when this is
    revisited, are Claude Code skills, Cursor and Windsurf rules, and GitHub
    Copilot instructions. An MCP server was considered and is not a target.
  rationale: >
    There is no second target yet, and one package is not a monorepo. Staying
    flat preserves a property the kit currently has and a workspace toolchain
    would cost: the whole repository can be read or vendored with nothing
    installed. The restructure is cheapest before first publish, since llms.txt
    and README paths become external references the moment anyone links them —
    so if a variant becomes real, do it before publishing rather than after.
