# Beat Version — conformant to specs/beat-version.yml
beat_version:
  id: HM-BV-001.1
  beat: HM-B-001
  title: Both rubrics published as agent skills
  status: delivered
  summary: >
    The two quality rubrics ship as invocable skills, each carrying the full
    dimension set, the shared scale, the check rules, and an output format an
    agent can follow without further instruction. A reader with a Beat and an
    agent can produce a scored assessment from the repository alone.
  scope: >
    In: beat-quality-check and plan-quality-check — dimensions, scale, check
    rules, output shape, and the explicit statement that the skills assess
    rather than enforce.
    Out: persistence of any score, gating on a score, an audit trail, and any
    rubric beyond Beat and plan quality.
