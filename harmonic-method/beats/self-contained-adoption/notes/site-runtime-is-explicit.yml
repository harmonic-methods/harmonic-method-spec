note:
  id: HM-N-170
  type: decision
  attached_to: HM-B-004
  beat_version: HM-BV-004.10
  content: >
    The standalone site's package engine, local version-manager hint and CI
    select Node 26 explicitly. Vercel uses the package engine when it overrides
    the saved dashboard runtime. The checker package retains its existing
    compatibility boundary.
  rationale: >
    The owner chose the currently supported LTS major for the new site. An open
    engine range can select a different major from CI and silently change on a
    later deployment. Selecting a major keeps minor and security patch updates
    available while making the tested and deployed runtime choice predictable.
