# Beat — conformant to specs/beat.yml
beat:
  id: HM-B-004
  title: Self-contained adoption path
  status: open
  coda:
    statement: >
      A newcomer can decide whether the Harmonic Method fits their work after
      trying it on one of their own capabilities and seeing what the result
      would help them improve. They can reach that decision without an account
      with the method's publisher or a guided introduction.
    parent: HM-CODA
  description: >
    The self-service path from a first encounter to an informed adoption
    decision. It gives newcomers an orientation, a worked example, and enough
    guidance to try a published rubric on their own work and decide whether
    to continue. Ongoing assessments of capabilities, plans, and whether
    intent still holds belong to Account-free quality scoring.
  # notes: see ./notes/ — the directory is the list.
  # versions: see ./versions/ — the directory is the list.
