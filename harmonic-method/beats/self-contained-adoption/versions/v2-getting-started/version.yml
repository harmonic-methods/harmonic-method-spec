# Beat Version — conformant to specs/beat-version.yml
beat_version:
  id: HM-BV-004.2
  beat: HM-B-004
  title: Getting started in three steps
  status: delivered
  summary: >
    The README explained what the method is but never what to do first, so a
    visitor had to infer adoption from the entity model. It now opens with three
    steps: score something with nothing installed, place a rubric in whichever
    agent you already use, and lay out your own system from the worked example.
    The step-two table covers Claude Code, Cursor and Windsurf, and Copilot,
    resting on the fact that SKILL.md is portable markdown — native placement is
    an optimization rather than a prerequisite, so no per-platform variant has to
    exist for the instructions to be true.
  scope: >
    In: a Getting started section in README.md, and moving the scoring
    invocation into it from the rubrics section so the two do not both carry it.
    Names the two caveats a newcomer would otherwise discover the hard way — the
    checker is kit-internal, and nothing here enforces anything.
    Out: per-platform skill variants, npm or plugin distribution instructions,
    and making the checker runnable against an adopter's tree.
