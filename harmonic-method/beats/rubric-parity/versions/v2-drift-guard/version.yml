# Beat Version — conformant to specs/beat-version.yml
beat_version:
  id: K-BV-002.2
  beat: K-B-002
  title: Canonical drift guard
  status: active
  summary: >
    A change to the rubric on either side should fail loudly rather than
    silently desync the two. The plan is a fingerprint over both dimension
    tables, anchors included, failing in the reference implementation's test
    suite whenever either table moves, with a failure message naming the
    re-translation steps in order rather than inviting a hash bump. NOT YET
    BUILT — no fingerprint, hash, or snapshot over either table exists, and the
    drift it was meant to catch has since happened undetected.
  scope: >
    In: the fingerprint over both dimension tables, an assertion that anchor
    coverage is actually included so the guard cannot go quietly anchor-blind,
    and a failure message that prevents a reflexive hash bump.
    Out: fingerprinting the surrounding prompt text — it embeds shared style
    constants that churn for unrelated reasons, and failures that frequent would
    train exactly the reflex the guard exists to prevent. Also out: generating
    the kit's text from canonical, which would overwrite the translation.
  # Known gap, tracked for a later version: the guard fires when canonical
  # moves, but nothing catches a direct edit to the kit's own skill files. A
  # kit-side check needs test tooling this repository does not yet have.
