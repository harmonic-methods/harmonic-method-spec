# Beat — conformant to specs/beat.yml (v1.0.0)
beat:
  id: K-B-002
  title: Rubric parity with the reference implementation
  status: open
  coda:
    statement: >
      A score produced from this repository means the same thing as a score
      produced by any conforming implementation, so a team can start locally and
      move into a system of record later without re-learning what a 4 is.
    parent: K-CODA
  description: >
    The capability by which the rubric dimensions, red flags, and anchors
    published here remain the definition every implementation scores against.
    This repository holds them; an implementation conforms to it at a pinned
    version. Keeping that true means the published text stays medium-agnostic
    rather than assuming software, extensions an implementation adds are
    distinguished from contradictions it introduces, and a change made here is
    recognized as a change to the standard rather than a local edit.
  # notes: see ./notes/ — the directory is the list.
  # versions: see ./versions/ — the directory is the list.
