# Beat — conformant to specs/beat.yml
beat:
  id: HM-B-005
  title: Named accountability functions
  status: open
  coda:
    statement: >
      A team can identify who answers for what each capability serves, how its
      work is planned and carried out, whether it still earns what it costs,
      and how useful practices reach others. Unassigned decisions are visible
      early enough for the team to act.
    parent: HM-CODA
  description: >
    The five functions give a team a common way to assign decisions about
    intent, planning, reconciliation, value, and adoption. Each function
    defines what it owns, how it fails, and what discipline it requires.
    The same functions apply across altitudes. A person can hold a function
    directly or answer for an agent holding it. Each team owns its
    assignments.
  # notes: see ./notes/ — the directory is the list.
  # versions: see ./versions/ — the directory is the list.
