name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Checks every entity file in harmonic/ and examples/ against specs/.
      # Exits non-zero on the first conformance failure.
      - run: npm run validate
