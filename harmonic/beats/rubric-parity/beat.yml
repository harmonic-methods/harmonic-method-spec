# Beat — conformant to specs/beat.yml (v1.0.0)
beat:
  id: K-B-002
  title: Rubric parity with the reference implementation
  status: open
  coda:
    statement: >
      A score produced by this kit means the same thing as a score produced by
      the reference implementation, so a team can start locally and move into
      Harmonica later without re-learning what a 4 is.
    parent: K-CODA
  description: >
    The capability by which the kit's published rubrics stay faithful to the
    canonical definitions they mirror — the reference implementation's rubric
    for a Beat's definition and its rubric for a Beat Version's plan, named
    there under whatever names those checks currently carry. The kit is
    a translation rather than a copy — it renames entities the reference
    implementation exposes differently, omits entities it does not define, and
    stays medium-agnostic — so parity is maintained deliberately and re-checked
    whenever the canonical rubric moves.
  # notes: see ./notes/ — the directory is the list.
  # versions: see ./versions/ — the directory is the list.
