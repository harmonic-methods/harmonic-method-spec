# Harmonic Method spec — Beat Version
entity: beat_version
spec_version: 1.2.0
summary: >
  A planned step in a Beat's evolution toward its Coda. Beats change through
  Beat Versions; each version is a bounded, testable increment of the capability.
fields:
  id: {type: string, required: true}
  beat: {type: reference, required: true, description: The parent Beat.}
  title: {type: string, required: true}
  summary:
    type: string
    required: true
    description: >
      What this step delivers and why. With scope, the prose the beat_version_quality
      rubric scores — acceptance criteria, assumptions, and dependencies belong
      here or in attached Notes.
  scope:
    type: string
    required: true
    description: What this step includes and excludes — bounded on purpose.
  status:
    type: enum [active, delivered, withdrawn]
    required: true
    additions: none
    children: none
    descriptions:
      active: In flight — planned, and neither finished nor set down.
      delivered: The planned step shipped.
      withdrawn: >
        Left flight without shipping — superseded, descoped, or dropped. Why it
        was withdrawn is rationale and belongs in a decision Note, not in this
        field.
  revisions:
    type: list<revision>
    description: The tracked changes that execute this version. See revision.yml.
rules:
  - A Beat Version's status is carried on the Beat Version. An implementation may
    derive an additional label from whatever its medium affords, but the three
    values are a field the method requires in every medium, not a projection of
    one.
quality:
  rubric: beat_version_quality  # see skills/beat-version-quality-check/SKILL.md
  dimensions: [Scoped, Directional, Testable, Traceable, Assignable, Risk-aware]
  scale: 1-5 per dimension
  reference_gate: >
    The reference implementation gates the first Revision on a passing plan
    check for the Beat Version. The gate is an implementation choice; the
    rubric is the spec.
