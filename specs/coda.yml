# Harmonic Method spec — Coda
entity: coda
spec_version: 1.14.1
summary: >
  The strategic outcome an entity exists to serve. Codas form a hierarchy —
  Portfolio Codas above System Codas above Beat Codas — so every step of work
  provably ladders up to strategy. The Portfolio layer recurses without limit,
  so the chain is as deep as its subject requires rather than three levels
  fixed: see portfolio.yml and system.yml for what sits at each altitude.
attached_to: [portfolio, system, beat]
fields:
  id:
    type: string
    required_when: another Coda's parent field references it
    description: >
      Addressable identifier. A Coda nothing points at does not need one — a
      Beat Coda at the bottom of the chain is carried by its Beat and identified
      by it. A Coda with children beneath it must be addressable, or they cannot
      ladder to it.
  statement:
    type: string
    required: true
    description: >
      Where this entity is headed and why, written as a resolved future state —
      not a task list. The Coda is spec-as-resolved-state: decomposition flows
      down from it, and alignment is measured against it.
  parent:
    type: reference
    required: false
    description: >
      The Coda one level up — a Beat's to its System's, a System's to the
      Portfolio holding it, a Portfolio's to the Portfolio holding that. Root
      Codas omit this, and having no parent is the whole of what makes a Coda
      root: it is a position in the tree rather than a kind of entity, so a
      System with nothing above it is as legitimately root as a Portfolio is.
rules:
  - >-
    A Beat without a Coda cannot be decomposed into Beat Versions.
  - >-
    Alignment ("harmonization") is assessed against the Coda chain, not against
    individual documents.
  - >-
    Changing a Coda is a recorded decision; the prior statement is preserved.
