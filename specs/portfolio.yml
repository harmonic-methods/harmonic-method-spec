# Harmonic Method spec — Portfolio
entity: portfolio
spec_version: 1.11.0
summary: >
  A Coda and the containers beneath it. A Portfolio holds Systems, other
  Portfolios, or both, and recurses without limit — which is what lets a tree
  reach whatever depth its subject actually has. It holds no Beats of its own:
  the altitude that holds capability is the System, and a Portfolio is every
  altitude above that one.
fields:
  id:
    type: string
    required_when: another entity references it
    description: >
      Addressable identifier. A Portfolio with children beneath it must be
      addressable, or they cannot ladder to it.
  coda:
    type: coda
    required: true
    description: >
      What this grouping is for, stated so its children can be measured against
      it. Omits `parent` when the Portfolio is root; names the Portfolio above
      it otherwise. See coda.yml.
  systems:
    type: list<system>
    description: >
      The Systems directly beneath this Portfolio. See system.yml.
  portfolios:
    type: list<portfolio>
    description: >
      The Portfolios directly beneath this Portfolio. Recursion has no
      declared depth limit.
  notes:
    type: list<note>
    description: >
      Knowledge held at this grouping rather than at any one child. See note.yml.
  proposals:
    type: list<proposal>
    description: >
      Candidates weighed against this Portfolio's Coda, which acceptance may
      turn into a System or a Portfolio one level down. See proposal.yml.
rules:
  - A Portfolio's children may be Systems, Portfolios, or a mix of both. The
    distinction between the two is not depth but whether Beats attach, so
    branches of different depths sitting side by side is the ordinary case.
    Requiring one kind of child would require every branch to reach the same
    depth, which no real subject does.
  - A Portfolio holds no Beats. A capability that wants to attach directly to a
    Portfolio is telling you a System is missing between them, and adding it is
    the fix rather than relaxing this rule.
  - Do not create a Portfolio to hold a single child. Its Coda would either
    restate the child's or be invented to fill the slot, and a statement written
    to satisfy a structure is the one kind this method has no use for. Let the
    child be root, or leave it where it is.
  - A Portfolio may be root, and only the entity with no parent is. Every other
    Portfolio in a tree has one and is measured against it exactly as a System
    or a Beat would be.
  - Nesting expresses containment and nothing else. A dependency between two
    Systems is not a nesting relationship and does not justify one — that
    relation is carried between the Beats that actually enable one another, and
    read upward from them.
