# Harmonic Method spec — conformance
#
# What conformance means, which files carry the standard, and how a divergence is
# classified. Declared here because a conformance claim with no published
# statement of what it covers is unfalsifiable, and because the check that can
# report conformance needs a statement of which files are normative before it can
# mean anything.
#
# Not an entity and not a concept: nothing instantiates this and no record
# carries it as a field. `statement:` is the third discriminator in this
# directory, after `entity:` and `concept:`.
statement: conformance
spec_version: 1.2.0
summary: >
  An implementation conforms to a spec set version. It does not conform to a
  repository tag, to a package version, or to another implementation. The claim
  covers the entity primitives in this directory and the rubric dimensions, red
  flags, and anchors in the instruments — the two things this repository is
  canonical for.
normative_surface:
  specs: >
    Every file in this directory: the fields, their required-ness, the lifecycle
    enums, and the rules stated on each entity.
  instruments: >
    In each instrument, the scoring scale, the dimension table or check list, and
    the check rules. A digest over those sections fails this repository's own
    check when any of them is edited without acknowledgement.
  relationships: >
    The relationships these specs state are normative: which entity a Note
    attaches to, which Beat a Beat Version belongs to, which Beat Version a
    Revision executes, and which Coda a Coda ladders to. An implementation has
    to be able to answer those questions. It does not have to answer them the
    way this repository does.
  encoding: >
    Not normative. No file here defines a directory layout, a file format, an
    identifier scheme, or a serialization, and none will — a method that holds
    for a procedure and a runbook cannot mandate one. A directory tree, a
    database, a single document, and a set of issue records all conform if the
    required fields are present and the relationships hold. The checker
    validates one concrete encoding, because a checker has to read something;
    that encoding is a convention this repository uses and recommends, not a
    condition of conformance.
  excluded: >
    Nothing else is normative, and an implementation is not measured against it:
    the front page, the agent-facing entry point, the contributor guide, the
    worked example, this repository's own recorded work, and the checker. A
    checker stricter than the specs is a defect in the checker.
classification:
  extension: >
    Defining an entity these specs do not, scoring a dimension the method omits,
    computing a value the method only names, or adding a boundary above the
    altitudes named here. An extension is allowed, needs no permission, and is
    declared rather than negotiated.
  contradiction: >
    A required field an implementation lacks, an enum value it renames or
    collapses, a dimension whose anchor text differs from the text published
    here, or a rule it inverts. A contradiction is a conformance failure, and it
    fails on the implementation's side.
declaration:
  summary: >
    What an implementation publishes to make its claim checkable. It lives with
    the implementation, not here — this states its shape so that two declarations
    can be read the same way, and so a check can tell a well-formed claim from a
    vague one.
  required:
    spec_version: >
      The value from `spec-set.yml` this claim is made against. A claim with no
      version attached cannot be checked.
    implementation: >
      The name of the system claiming. A declaration says who is claiming.
    divergences: >
      Every contradiction the implementation knows it carries, each naming the
      spec file, the field or rule, what this repository publishes, and what the
      implementation does instead. May be empty, and an empty list is the whole
      point of the field — it is the strong claim, that nothing published here is
      contradicted, and it is what makes the declaration falsifiable. Omitting
      the list is not the same as declaring it empty.
  optional:
    extensions: >
      What the implementation adds — an entity, a field, a child of a published
      enum value, a value on an enum that allows additions, a dimension it scores
      beyond the instruments, or a value it computes. Each names its kind. Informative rather than load-bearing: an
      extension needs no permission, so a reader who wants only to know whether a
      score means the same thing can skip the list.
    mappings: >
      The implementation's own vocabulary against the primitives declared here,
      for a reader who has to translate. Each names both sides.
  limits: >
    A declaration is a claim, and checking it verifies the claim's form rather
    than the implementation's behaviour. Nothing readable from outside can
    establish that a system does what it says; what a check can establish is that
    the statement is specific enough to be wrong. That is the failure being
    guarded against — a claim too vague for anyone to contradict.
rules:
  - An implementation declares conformance to the single version in
    `spec-set.yml`, never to a version per file. The specs move as a set.
  - A distinction the method requires on an entity is carried by that entity. An
    implementation may compute an additional label from whatever its medium
    affords, but a value derived from a signal that exists in only one medium
    does not satisfy a field the method requires in every medium.
  - Where an implementation extends the method, the mapping from its own
    containers and vocabulary onto these primitives belongs in that
    implementation's conformance declaration, not in this repository.
  - Every enum declares whether additions are allowed and whether children are,
    in `additions` and `children` keys beside it. A value an implementation adds is an extension where that key
    reads allowed, and a contradiction where it reads none. An enum carrying no
    declaration is closed, so a new enum either decides the question or inherits
    the stricter answer.
  - Where children are allowed, an implementation may narrow a published value
    instead of adding a sibling to it. A child is an extension, and it degrades —
    a reader who does not know the child still knows its parent, which a sibling
    does not offer. Prefer a child wherever one will carry the meaning.
  - Where additions are allowed, an added value widens the set and does not
    redefine it. An implementation may not give a published value a different
    meaning, and an added value may not overlap one.
  - A declaration lists every contradiction its author knows about. Declaring one
    does not make it conformant, and describing it as a simplification instead of
    listing it is the failure the list exists to prevent.
  - Nothing filed as an extension may be a contradiction under another name. An
    added value on an enum that declares additions none belongs under
    divergences, whatever it is called.
  - A recorded score names the spec set version it was produced under, and the
    state of what it judged. Staleness has two sides — the thing scored can change
    after the score and so can the rubric — and an implementation that gates on a
    score has to be able to detect both. Detecting only the first leaves a passing
    result standing against definitions it was never produced against.
  - Silence is permission. Where these specs say nothing, an implementation is
    free; where they state a field, an enum, or a rule, following it is what the
    claim means.
  - A conformance claim names the spec set version it was made against. A claim
    with no version attached cannot be checked and is not a claim.
