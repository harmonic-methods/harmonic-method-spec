# Harmonic Method spec — Note
entity: note
spec_version: 1.2.0
summary: >
  Typed knowledge attached to the entity it informs. Notes are the decision
  and context lineage: why things are the way they are, preserved where the
  work happens rather than in disconnected documents.
type_hierarchy: >
  The four types are a hierarchy, not a list. Every Note is context in the
  general sense — the Note is the context — and `type` names the specialization
  it rises to. No value is called context, so the word for the whole is never
  also the word for a part: the type for a Note that rises to no narrower kind is
  `background`. An implementation needing a finer kind narrows a published value
  through `subtype` rather than adding a fifth type nobody else can read.
fields:
  id: {type: string, required: true}
  type:
    type: enum [background, constraint, guidance, decision]
    required: true
    additions: none
    children: allowed
    descriptions:
      background: >
        Knowledge that rises to no narrower kind — what a contributor or agent
        needs to know to act well here. Named for the case rather than for the
        category, so that "context" stays the word for all four and never doubles
        as one of them.
      constraint: A boundary that must be respected (technical, legal, commercial).
      guidance: How to approach work in this area; standards and preferences.
      decision: A choice that was made, with its rationale — the core lineage type.
  subtype:
    type: string
    required: false
    description: >
      A narrower kind within the type, for a taxonomy the method does not name —
      a file-derived context, a statutory constraint, a reversed decision. The
      method enumerates no subtypes and will not: the point is that an
      implementation can be precise without inventing a top-level type nobody
      else can read. One level only.
  content: {type: string, required: true}
  rationale:
    type: string
    required_when: type == decision
    description: Why this decision was made; decisions without reasoning are not lineage.
  attached_to:
    type: reference
    required: true
    description: The portfolio, system, or Beat this knowledge belongs to.
  beat_version:
    type: reference
    required: false
    description: >
      The Beat Version this Note arose from or applies to, when it is narrower
      than the Beat. The Note still belongs to the Beat: a Beat Version is a
      passing step and ends, while the knowledge outlives it.
rules:
  - Notes are preserved, not overwritten; superseding is a new Note referencing the old.
  - Decisions cite what they supersede when they change course.
  - Every Note is context in the general sense — the Note is the context — and
    `type` names the specialization it rises to. No value is called context, so
    that the word for the whole is never also the word for a part.
  - A subtype narrows its type and never contradicts it. A reader that does not
    recognize a subtype falls back to the type, which is the whole reason the
    type is closed and the subtype is free.
  - A Note never attaches to a Beat Version. Knowledge that outlives the step
    belongs to the Beat; use beat_version to record which step produced it.
