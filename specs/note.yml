# Harmonic Method spec — Note
entity: note
spec_version: 1.11.0
summary: >
  Typed knowledge attached to the entity it informs. Notes are the decision
  and context lineage: why things are the way they are, preserved where the
  work happens rather than in disconnected documents.
kind_and_dimension: >
  A Note's kind is what the knowledge is. It is one value — `type`, optionally
  narrowed by `subtype` — and nothing else belongs in that slot. Everything else
  a Note carries is a dimension: a property any kind can hold in any degree,
  orthogonal to kind and to the other dimensions. How sure someone is, how far
  the consequences travel, who may read it, where it came from, whether anyone
  has checked it — none of these is a kind of knowledge. A dimension put in the
  kind slot makes the kinds incomparable, because two Notes then differ on two
  axes while appearing to differ on one.
dimensions:
  method_named: >
    `supersedes` — which Note or Notes this one closes. It is named here rather
    than left to an implementation because the rule two sections down already
    requires it in prose ("superseding is a new Note referencing the old"), and
    a requirement stated in prose with nothing to hold it is exactly the shape of
    gap this method keeps finding in itself. Naming it here makes the reference
    parseable, so which Notes still stand is answered by walking the tree rather
    than by reading every rationale.

    It is not the same question as processing or triage state, which stays
    implementation-owned below. Triage asks whether a Note has been reviewed or
    acted on; supersedes asks whether a Note's content still applies. The two are
    independent — a superseded Note may have been fully triaged, and a live one
    may not have been looked at yet — and an implementation carrying triage state
    answers a different question than this field does.
  implementation_owned: >
    Confidence, reach of consequence, classification and confidentiality tiers,
    provenance, processing or triage state, and retention. An implementation
    carrying any of them is extending the method, and declares them as field
    extensions. Two are constrained without being specified — lineage must be
    legible whatever the classification scheme, and Notes do not expire — and
    those constraints are rules below rather than fields here. Provenance is
    constrained the same way — a recorded source resolves for whoever can read
    the Note — without the method saying what a source is.
type_hierarchy: >
  The four types are a hierarchy, not a list. Every Note is context in the
  general sense — the Note is the context — and `type` names the specialization
  it rises to. No value is called context, so the word for the whole is never
  also the word for a part: the type for a Note that rises to no narrower kind is
  `background`. An implementation needing a finer kind narrows a published value
  through `subtype` rather than adding a fifth type nobody else can read.
fields:
  id: {type: string, required: true}
  type:
    type: enum [background, constraint, guidance, decision]
    required: true
    additions: none
    children: allowed
    descriptions:
      background: >
        Knowledge that rises to no narrower kind — what a contributor or agent
        needs to know to act well here. Named for the case rather than for the
        category, so that "context" stays the word for all four and never doubles
        as one of them.
      constraint: A boundary that must be respected (technical, legal, commercial).
      guidance: How to approach work in this area; standards and preferences.
      decision: A choice that was made, with its rationale — the core lineage type.
  subtype:
    type: string
    required: false
    description: >
      A narrower kind within the type, for a taxonomy the method does not name —
      a file-derived context, a statutory constraint, a reversed decision. The
      method enumerates no subtypes and will not: the point is that an
      implementation can be precise without inventing a top-level type nobody
      else can read. One level only.
  content: {type: string, required: true}
  rationale:
    type: string
    required_when: type == decision
    description: Why this decision was made; decisions without reasoning are not lineage.
  attached_to:
    type: reference
    required: true
    description: >
      The portfolio, system, Beat, or Proposal this knowledge belongs to. A
      Proposal being weighed accumulates the same deliberation any other
      capability does — why it is taking a while, what would have to be true
      for it to be taken up — and needs somewhere legible to hold it before it
      is anything durable enough to hold Notes of its own the way a Beat does.
  beat_version:
    type: reference
    required: false
    description: >
      The Beat Version this Note arose from or applies to, when it is narrower
      than the Beat. The Note still belongs to the Beat: a Beat Version is a
      passing step and ends, while the knowledge outlives it.
  supersedes:
    type: list<note>
    required: false
    description: >
      The Note or Notes this one closes — content that no longer applies, or a
      decision reversing an earlier one. Written on the superseding Note; the
      Note or Notes referenced are never edited. Unlike `versions`, `notes`, or
      `revisions` elsewhere in this method, this is a literal field on the
      instance and not a derived directory listing — supersession runs between
      two Notes that may sit anywhere in the tree, not between a parent and the
      children beneath it, so there is no containment to read it from.
rules:
  - Notes are preserved, not overwritten; superseding is a new Note whose
    `supersedes` references the old. Nothing is written onto the Note being
    closed — the reference runs one way, which is what keeps the first half of
    this rule true.
  - Preservation begins when a Note becomes readable by anyone but its author.
    Before that it is a draft and may be edited freely; after it, correcting
    it destroys evidence someone may have acted on, and the correction is a
    supersession. Every medium has this boundary and only some have it built
    in — a commit is one, a shared record is one, a document leaving a desk is
    one. An implementation whose store publishes on write has to draw the
    boundary itself, because the rule above begins there and not at creation.
  - A change that would not have altered what a reader did is maintenance, not
    supersession. Fixing a misspelling or a broken link leaves the record
    saying what it said; changing what it asserts does not, and only the
    second owes a superseding Note. The test is the reader, not the byte
    count.
  - A maintenance edit stays visible as an edit, and the text it replaced stays
    recoverable by anyone who can read the Note. Without that, the rule above
    is unfalsifiable — an author could relabel a change of meaning as a typo
    and no reader could tell — and the first rule here stops being literally
    true, because an untraced edit is an overwrite. What satisfies this varies
    by medium and none of it is specified — a commit history, a stored revision,
    a struck-through line with an initial beside it. What may not vary is that
    the trace is as readable as the Note, since a trace nobody can open is the
    citation nobody can follow.
  - A Note that carries `supersedes` is a decision, so its required rationale
    states why the Note or Notes it lists no longer stand. One rationale may
    close several at once; what it may not do is close any without one.
  - A Note nothing supersedes is active; a Note something supersedes is not.
    Neither is a stored field — an implementation reads the partition off
    `supersedes`, not beside it, so the two can never disagree.
  - The field only closes. There is no operation that reopens a Note, so one
    whose superseder is later superseded by something else does not return to
    active — what reopens a closed matter is a new decision addressing it
    directly, not the retirement of the decision that closed it.
  - Every Note is context in the general sense — the Note is the context — and
    `type` names the specialization it rises to. No value is called context, so
    that the word for the whole is never also the word for a part.
  - A subtype narrows its type and never contradicts it. A reader that does not
    recognize a subtype falls back to the type, which is the whole reason the
    type is closed and the subtype is free.
  - A dimension is never expressed as a type. A property that any kind can carry
    belongs in a field of its own, whether or not the method names that field.
  - A Note is legible to everyone who can act on the entity it informs. An
    implementation may classify and restrict, and most will; what it may not do
    is let a Note be cited as lineage by a reader who cannot open it. A citation
    nobody can follow is not lineage.
  - Where a restriction genuinely forbids that, what gets written at the readable
    level is the lineage — a Note stating the choice and its reasoning without
    the restricted material, which then stands as evidence rather than as the
    record. A redacted rationale is honest. A citation to something nobody can
    read is not.
  - Where a Note records what it was derived from, that reference resolves for
    everyone who can read the Note. Provenance is an implementation's to define
    and none is required here; what an implementation may not do is cite a
    source its readers cannot reach, which is the legibility bound above
    applied to the citation rather than to the Note. A source that cannot be
    opened is not provenance, it is an assertion that provenance exists.
  - A Note does not expire. There is no time to live and no automatic disposal —
    a record that removes itself because time passed contradicts the first rule
    here. Retention under an obligation is a different question and is not
    settled by this.
  - Knowledge that has arrived and is not yet attached is not a Note. `attached_to`
    is required and stays required — it is what makes a Note lineage rather than a
    document, because a decision nobody can reach from its consequences is not
    recoverable. Capture before attachment is a stage before a Note, not a Note
    with a field missing.
  - Promoting captured knowledge into an attached record — deciding what it
    implies about capability — is the Composer's to answer for. It is the same
    judgement that function already owns — what the system is for, what belongs
    inside it, and where its boundaries fall. An implementation may automate the
    act; the accountability does not move.
  - A Note never attaches to a Beat Version. Knowledge that outlives the step
    belongs to the Beat; use beat_version to record which step produced it.
