# Harmonic Method spec — Note
entity: note
spec_version: 1.2.0
summary: >
  Typed knowledge attached to the entity it informs. Notes are the decision
  and context lineage: why things are the way they are, preserved where the
  work happens rather than in disconnected documents.
kind_and_dimension: >
  A Note's kind is what the knowledge is. It is one value — `type`, optionally
  narrowed by `subtype` — and nothing else belongs in that slot. Everything else
  a Note carries is a dimension: a property any kind can hold in any degree,
  orthogonal to kind and to the other dimensions. How sure someone is, how far
  the consequences travel, who may read it, where it came from, whether anyone
  has checked it — none of these is a kind of knowledge. A dimension put in the
  kind slot makes the kinds incomparable, because two Notes then differ on two
  axes while appearing to differ on one.
dimensions:
  method_named: >
    None yet, deliberately. The distinction is stated before any dimension is
    named because the distinction is what stops the next one arriving as a type,
    and it holds whatever the eventual list turns out to be. Naming a dimension
    is a separate decision each time, and each needs a vocabulary that survives
    the entity model growing.
  implementation_owned: >
    Confidence, reach of consequence, classification and confidentiality tiers,
    provenance, processing or triage state, and retention. An implementation
    carrying any of them is extending the method, and declares them as field
    extensions. Two are constrained without being specified — lineage must be
    legible whatever the classification scheme, and Notes do not expire — and
    those constraints are rules below rather than fields here.
fields:
  id: {type: string, required: true}
  type:
    type: enum [background, constraint, guidance, decision]
    required: true
    additions: none
    children: allowed
    descriptions:
      background: >
        Knowledge that rises to no narrower kind — what a contributor or agent
        needs to know to act well here. Named for the case rather than for the
        category, so that "context" stays the word for all four and never doubles
        as one of them.
      constraint: A boundary that must be respected (technical, legal, commercial).
      guidance: How to approach work in this area; standards and preferences.
      decision: A choice that was made, with its rationale — the core lineage type.
  subtype:
    type: string
    required: false
    description: >
      A narrower kind within the type, for a taxonomy the method does not name —
      a file-derived context, a statutory constraint, a reversed decision. The
      method enumerates no subtypes and will not: the point is that an
      implementation can be precise without inventing a top-level type nobody
      else can read. One level only.
  content: {type: string, required: true}
  rationale:
    type: string
    required_when: type == decision
    description: Why this decision was made; decisions without reasoning are not lineage.
  attached_to:
    type: reference
    required: true
    description: The portfolio, system, or Beat this knowledge belongs to.
  beat_version:
    type: reference
    required: false
    description: >
      The Beat Version this Note arose from or applies to, when it is narrower
      than the Beat. The Note still belongs to the Beat: a Beat Version is a
      passing step and ends, while the knowledge outlives it.
rules:
  - Notes are preserved, not overwritten; superseding is a new Note referencing the old.
  - Decisions cite what they supersede when they change course.
  - Every Note is context in the general sense — the Note is the context, and
    `type` names the specialization it rises to. No value is called context, so
    that the word for the whole is never also the word for a part.
  - A subtype narrows its type and never contradicts it. A reader that does not
    recognize a subtype falls back to the type, which is the whole reason the
    type is closed and the subtype is free.
  - A dimension is never expressed as a type. A property that any kind can carry
    belongs in a field of its own, whether or not the method names that field.
  - A Note is legible to everyone who can act on the entity it informs. An
    implementation may classify and restrict, and most will; what it may not do
    is let a Note be cited as lineage by a reader who cannot open it. A citation
    nobody can follow is not lineage.
  - Where a restriction genuinely forbids that, what gets written at the readable
    level is the lineage — a Note stating the choice and its reasoning without
    the restricted material, which then stands as evidence rather than as the
    record. A redacted rationale is honest. A citation to something nobody can
    read is not.
  - A Note never attaches to a Beat Version. Knowledge that outlives the step
    belongs to the Beat; use beat_version to record which step produced it.
