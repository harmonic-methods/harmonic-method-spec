# Harmonic Method spec — Bar
entity: bar
spec_version: 1.15.1
summary: >
  The recurring period work is planned and delivered within — the regular
  cadence a Conductor reconciles against. A Bar is a span of time with a
  boundary at each end; crossing a boundary is the routine occasion for taking
  a Downbeat on each capability in view. The instant a Bar ends is its
  Cutoff, and the ceremony that settles the Bar's unfinished work after it
  is its Tie off.
attached_to: [portfolio, system]
fields:
  id: {type: string, required: true}
  attached_to:
    type: reference
    required: true
    description: >
      The portfolio or system whose cadence this Bar belongs to. Altitude is
      recursion, so a portfolio of portfolios runs its own Bars.
  starts:
    type: timestamp
    required: true
    description: >
      The instant the Bar opens — the first instant inside its window. Where a
      sibling precedes it without a gap, this is the same instant as that
      sibling's Cutoff. The Bar starts then even if the preceding Bar's Tie off
      has not finished; neither Tie off nor Downbeat determines its start.
      It carries a time of day and an explicit UTC offset,
      both the cadence owner's — for example 2026-10-21T09:00:00-07:00. A
      date alone, or a time of day with no offset, is not a valid value.
  ends:
    type: timestamp
    required: true
    description: >
      The Cutoff — the instant the Bar ends, and the first instant outside its
      window. Like `starts`, it carries a time of day and an explicit UTC
      offset, both the cadence owner's. A date alone is not a valid value: a
      date names a day rather than an instant, and a day cannot be the
      boundary between two Bars without belonging to one of them. A time with
      no offset is not valid either, because it means a different instant to
      each reader.
  status:
    type: enum [open, closed]
    required: true
    additions: none
    children: none
    description: >
      Binary — open (the current or a future period, or one past its Cutoff
      whose Tie off has not finished) or closed (elapsed and tied off).
  parent:
    type: reference
    required: false
    description: >
      The enclosing Bar, when a longer period groups shorter ones — a quarter
      over its fortnights. This is temporal containment at one altitude, NOT a
      change of altitude: a parent Bar and its children may all belong to the
      same portfolio. Root Bars omit this.
rules:
  - >-
    A parent Bar contains its children in time — no child starts before it or
    ends after it.
  - >-
    Bars sharing a parent do not overlap. Overlapping periods make "which Bar
    are we in" unanswerable, which defeats the purpose of having one.
  - >-
    A Bar's window is half-open: it includes its start and excludes its Cutoff.
    One Bar's Cutoff and the next Bar's start may be the same instant, which
    leaves no gap, no overlap, and no moment both could claim. Work done before
    the Cutoff belongs to the outgoing Bar; work done at or after it belongs to
    the incoming one. Where a Bar's window is shown, the Cutoff is shown as an
    instant rather than as an inclusive last day — a pair of date ranges that
    share a day at both ends invites the question of which Bar owns it.
  - >-
    The Tie off is the ceremony, held at or after the Cutoff, that settles every
    unfinished item in the Bar before the Bar is closed. It is held by the
    Conductor, because it closes the gap between what the Bar was planned to
    deliver and what it did. It is a ceremony and not an entity — nothing
    records it as a record of its own and no field carries it; its outcome is
    the Bar's move to closed. An unfinished item that continues into the next
    Bar is tied across it, named for the musical tie that carries a note
    across the barline, so "Tie off" names the ceremony and "tie across" the
    carry, and no one term means both. The method records no item outcomes — it adds no
    field, enum, or entity for them — and how an implementation records which
    items were tied across is its own choice. Changing the cadence itself is a
    different decision, taken ahead of the doing, and is not part of a Tie off.
  - >-
    At a boundary the order is Cutoff, then Tie off, then Downbeat. Where the
    cadence is continuous, the incoming Bar starts at the outgoing Bar's
    Cutoff, even while the outgoing Bar remains open awaiting Tie off. Tie off
    may finish later; Downbeat follows the completed Tie off and records the
    capability's state at its actual taking time. Neither a later Tie off nor
    a later Downbeat shifts the Bar windows or changes which Bar owns work.
    A Downbeat taken before Tie off finishes records a Bar whose unfinished
    work is still unsettled.
  - >-
    A Bar's boundary is the occasion for a Downbeat, not a substitute for one.
    A period that elapses without an anchor being taken leaves nothing to
    reconcile against later.
  - >-
    A longer cadence is a Bar with children, never a separate kind of period.
    The method names one cadence entity and nests it, for the same reason Codas
    nest rather than being renamed at each altitude.
