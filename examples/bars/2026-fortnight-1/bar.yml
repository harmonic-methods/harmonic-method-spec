# Example — a shorter period inside the quarter, showing that a longer cadence is
# a Bar with children rather than a second entity. Nesting is a reference, not a
# directory: the parent contains this one in time at the same altitude. The
# window is half-open, so `ends` is the Cutoff — the first instant outside the
# Bar, and the instant the next fortnight starts. Both boundaries are instants
# in the cadence owner's time zone, here US Pacific at 09:00, with the offset
# written out. See specs/bar.yml.
bar:
  id: EX-BAR-2026-F1
  attached_to: EX-SYS-CODA
  starts: 2026-01-01T09:00:00-08:00
  ends: 2026-01-15T09:00:00-08:00
  status: closed
  parent: EX-BAR-2026-Q1
